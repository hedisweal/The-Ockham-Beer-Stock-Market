<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dricie Beer Stock Market - Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background-color: #0b0e14; 
      color: #ffffff; 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: -apple-system, sans-serif; 
      margin: 0;
    }
    .hub-card { 
      background: #161b22; 
      border: 1px solid #30363d; 
      border-radius: 16px; 
      padding: 3.5rem 2.5rem; 
      text-align: center; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
      max-width: 450px; 
      width: 100%; 
    }
    .btn-screen { 
      background-color: #58a6ff; 
      color: #0b0e14; 
      font-weight: 800; 
      transition: all 0.2s; 
      border: none;
    }
    .btn-screen:hover { 
      background-color: #79b8ff; 
      transform: translateY(-2px); 
      box-shadow: 0 5px 15px rgba(88,166,255,0.2); 
    }
    .btn-pos { 
      background-color: #238636; 
      color: #ffffff; 
      font-weight: 800; 
      transition: all 0.2s; 
      border: none;
    }
    .btn-pos:hover { 
      background-color: #2ea043; 
      color: #ffffff;
      transform: translateY(-2px); 
      box-shadow: 0 5px 15px rgba(35,134,54,0.2); 
    }
  </style>
</head>
<body>
  <div class="hub-card">
    <h1 class="fw-bold mb-2 text-warning" style="letter-spacing: 1px;">🍺 DRICIE EXCHANGE</h1>
    <p class="text-secondary mb-5">Welcome to the Ockham Beer Stock Market. Select your interface below.</p>
    
    <div class="d-grid gap-3">
      <a href="/screen.html" class="btn btn-screen btn-lg py-3 rounded-3">
        📊 PUBLIC MARKET SCREEN
      </a>
      <a href="/bartender_admin.html" class="btn btn-pos btn-lg py-3 rounded-3">
        🍻 BARTENDER POS LOGIN
      </a>
    </div>
  </div>
</body>
</html>
