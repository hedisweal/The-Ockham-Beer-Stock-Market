<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dricie Beer Stock Market</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; color: #ffffff; overflow-x: hidden; font-family: -apple-system, sans-serif; user-select: none; }
    .header-bar { border-bottom: 1px solid #21262d; background: rgba(22, 27, 34, 0.95); backdrop-filter: blur(10px); z-index: 1000; position: relative; }
    .timer-container { font-family: 'Courier New', Courier, monospace; font-size: 2.2rem; font-weight: 800; min-width: 140px; text-align: right; letter-spacing: -1px; }
    .timer-alert { color: #f85149 !important; animation: blink 0.6s infinite alternate; }
    @keyframes blink { from { opacity: 1; text-shadow: 0 0 10px rgba(248,81,73,0.8); } to { opacity: 0.5; text-shadow: none; } }
    
    .sidebar { max-height: calc(100vh - 130px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

    .menu-item { border: 1px solid transparent; transition: background 0.2s; cursor: pointer; }
    .menu-item:hover, .menu-item:active { background: rgba(255,255,255,0.05); }
    .menu-item.active-drink { background: rgba(88,166,255,0.1); border-left: 4px solid #58a6ff; }
    
    .graph-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .stock-price { font-family: 'Courier New', Courier, monospace; font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
    
    .price-up { color: #3fb950; text-shadow: 0 0 8px rgba(63,185,80,0.3); } 
    .price-down { color: #f85149; text-shadow: 0 0 8px rgba(248,81,73,0.3); }  
    .price-stable { color: #8b949e; }
    
    .ticker-bar { background: #010409; border-top: 1px solid #30363d; white-space: nowrap; overflow: hidden; position: fixed; bottom: 0; width: 100%; height: 42px; display: flex; align-items: center; z-index: 100; }
    /* OPTIMISATION SAFARI : will-change force le rendu matériel GPU */
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; font-size: 1.05rem; font-weight: 600; will-change: transform; }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body>
  <div id="app" class="pb-5">
    <div class="header-bar px-4 py-3 d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h4 fw-bold m-0 text-warning" style="letter-spacing: 1px;">DRICIE EXCHANGE</h1>
        <small class="text-secondary">Live Multi-Asset Monitoring</small>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary text-uppercase fw-semibold" style="font-size: 0.85rem; letter-spacing: 1px;">Next Tick:</span>
        <div class="timer-container" :class="{ 'timer-alert': tickTimeLeft <= 10 }">{{ formattedTime }}</div>
      </div>
    </div>

    <div class="container-fluid px-4">
      <div class="row g-4">
        
        <div class="col-lg-3 col-xl-2 sidebar">
          <h6 class="text-secondary fw-bold mb-3 ms-2 text-uppercase" style="letter-spacing: 1px;">Market Watch</h6>
          <div class="list-group list-group-flush bg-transparent gap-1">
            <button v-for="(b, id) in beers" :key="'menu-'+id"
                    @click="toggleGraphSelection(id)"
                    class="list-group-item list-group-item-action bg-transparent text-light d-flex justify-content-between align-items-center rounded menu-item p-2"
                    :class="{'active-drink': displayedGraphs.includes(id)}">
              <div class="text-truncate me-2" style="font-size: 0.95rem;">
                <span v-if="displayedGraphs.includes(id)">👁️</span> {{ b.name }}
              </div>
              <div :class="getPriceTrendClass(b)" class="fw-bold" style="font-family: monospace; font-size: 1rem;">
                €{{b.price.toFixed(2)}}
              </div>
            </button>
          </div>
        </div>

        <div class="col-lg-9 col-xl-10">
          <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
            <div class="col" v-for="id in displayedGraphs" :key="'graph-comp-'+id">
              <graph-card :drink="beers[id]"></graph-card>
            </div>
          </div>
        </div>
        
      </div>
    </div>

    <div class="ticker-bar">
      <div class="ticker-content text-secondary">
        <span v-for="(b, id) in beers" :key="'ticker-'+id" class="me-5">
          <strong class="text-light">{{ b.name }}</strong> 
          <span :class="getPriceTrendClass(b)" class="ms-1">€{{ b.price.toFixed(2) }}</span>
        </span>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  
  <script>
    const { createApp } = Vue;

    const GraphCard = {
      props: ['drink'],
      template: `
        <div class="graph-card h-100 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="fw-bold m-0 text-light text-truncate" style="max-width: 200px;">{{ drink.name }}</h5>
            <div class="text-end">
              <div class="stock-price" :class="trendClass">€{{ drink.price.toFixed(2) }}</div>
              <small :class="trendClass" class="fw-bold">{{ trendSymbol }}</small>
            </div>
          </div>
          <div class="flex-grow-1 position-relative mt-2" style="min-height: 220px;">
            <canvas ref="canvasEl"></canvas>
          </div>
        </div>
      `,
      data() {
        return { chart: null };
      },
      computed: {
        trendClass() {
          if (!this.drink || !this.drink.history) return 'price-stable';
          const hist = this.drink.history;
          const firstPoint = hist[0];
          const currentPoint = hist[hist.length - 1];
          if (currentPoint > firstPoint) return 'price-up';
          if (currentPoint < firstPoint) return 'price-down';
          return 'price-stable';
        },
        trendSymbol() {
          if (!this.drink || !this.drink.history) return '• 0.00';
          const hist = this.drink.history;
          const prev = hist[hist.length - 2] || hist[0];
          const diff = this.drink.price - prev;
          if (diff > 0) return '▲ +' + diff.toFixed(2);
          if (diff < 0) return '▼ ' + Math.abs(diff).toFixed(2);
          return '• 0.00';
        }
      },
      mounted() {
        this.initChart();
      },
      watch: {
        'drink.history': {
          handler() { this.updateChart(); },
          deep: true
        }
      },
      methods: {
        createGradient(ctx, colorHex) {
          const gradient = ctx.createLinearGradient(0, 0, 0, 180);
          gradient.addColorStop(0, colorHex + '40'); 
          gradient.addColorStop(1, colorHex + '00'); 
          return gradient;
        },
        initChart() {
          const canvas = this.$refs.canvasEl;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');

          const hist = this.drink.history;
          const firstPoint = hist[0];
          const currentPoint = hist[hist.length - 1];
          const color = currentPoint >= firstPoint ? '#3fb950' : '#f85149';
          const labels = Array.from({ length: hist.length }, (_, i) => i);

          this.chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                data: [...hist],
                borderColor: color,
                backgroundColor: this.createGradient(ctx, color),
                borderWidth: 2,
                fill: true,
                pointRadius: 0,
                tension: 0, 
                normalized: true // OPTIMISATION SAFARI : Divise l'utilisation CPU par 3
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: false, // OPTIMISATION SAFARI : Coupe 100% du moteur d'animation interne
              plugins: { legend: { display: false }, tooltip: { enabled: false } },
              scales: {
                x: { display: false }, 
                y: {
                  position: 'right',
                  grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                  ticks: { color: '#8b949e', font: { family: 'monospace', size: 12 }, callback: (val) => '€' + val.toFixed(2) }
                }
              }
            }
          });
          
          this.updateScales(hist);
        },
        updateChart() {
          if (!this.chart || !this.drink || !this.drink.history) return;
          
          const hist = this.drink.history;
          const firstPoint = hist[0];
          const currentPoint = hist[hist.length - 1];
          const color = currentPoint >= firstPoint ? '#3fb950' : '#f85149';

          this.chart.data.datasets[0].data = [...hist];
          this.chart.data.datasets[0].borderColor = color;
          this.chart.data.datasets[0].backgroundColor = this.createGradient(this.chart.ctx, color);
          
          this.updateScales(hist);
          this.chart.update(); // animation: false s'occupe de bloquer l'animation proprement
        },
        updateScales(hist) {
          const minVal = Math.min(...hist);
          const maxVal = Math.max(...hist);
          this.chart.options.scales.y.suggestedMin = minVal - 0.15;
          this.chart.options.scales.y.suggestedMax = maxVal + 0.15;
        }
      },
      beforeUnmount() {
        if (this.chart) {
          // Vidage mémoire préventif pour Safari avant la destruction de l'objet
          this.chart.clear();
          this.chart.destroy();
        }
      }
    };

    const app = createApp({
      components: { 'graph-card': GraphCard },
      data() {
        return {
          socket: null,
          beers: {},
          tickTimeLeft: 30,
          selectedForGraph: [] 
        };
      },
      computed: {
        formattedTime() {
          const s = this.tickTimeLeft;
          return `00:${s < 10 ? '0' : ''}${s}`;
        },
        displayedGraphs() {
          if (this.selectedForGraph.length > 0) return this.selectedForGraph;
          return Object.keys(this.beers).slice(0, 4);
        }
      },
      methods: {
        toggleGraphSelection(id) {
          if (this.selectedForGraph.includes(id)) {
            this.selectedForGraph = this.selectedForGraph.filter(k => k !== id);
          } else {
            this.selectedForGraph = [...this.selectedForGraph, id];
          }
        },
        getPriceTrendClass(drink) {
          if (!drink || !drink.history || drink.history.length === 0) return 'price-stable';
          const firstPoint = drink.history[0];
          const currentPoint = drink.history[drink.history.length - 1];
          if (currentPoint > firstPoint) return 'price-up';
          if (currentPoint < firstPoint) return 'price-down';
          return 'price-stable';
        }
      },
      mounted() {
        this.socket = io();
        this.socket.on('market_update', (data) => {
          this.beers = data.beers;
          this.tickTimeLeft = data.tickTimeLeft;
        });
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
